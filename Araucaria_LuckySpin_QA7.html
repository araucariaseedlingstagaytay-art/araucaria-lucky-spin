<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Araucaria Lucky Spin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eef7ee;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #176b35;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 30px auto;
        }

        canvas {
            width: 400px;
            height: 400px;
            border-radius: 50%;
        }

        .pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid #d62828;
            z-index: 10;
        }

        button {
            background: #176b35;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #0e4d26;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #result {
            margin-top: 25px;
            font-size: 26px;
            font-weight: bold;
            color: #176b35;
        }
    </style>
</head>

<body>

    <h1>🌱 Araucaria Lucky Spin 🎡</h1>

    <p>Try your luck!</p>
<div style="margin: 20px;">

    <label for="quantity">
        <strong>Enter Order Quantity:</strong>
    </label>

    <br><br>

    <input
        type="number"
        id="quantity"
        placeholder="Example: 1000"
        min="500"
        step="500"
        style="
            padding: 10px;
            font-size: 18px;
            width: 180px;
            text-align: center;
        "
    >

    <br><br>

    <button id="checkSpins">
        CHECK MY SPINS
    </button>

    <div
        id="spinInfo"
        style="
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #176b35;
        "
    ></div>

</div>
    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <button id="spinButton">SPIN!</button>

    <div id="result"></div>

    <script>

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const result = document.getElementById("result");

    let prizes = [
    "+15 FREE SEEDLINGS",
    "+15 FREE SEEDLINGS",
    "+20 FREE SEEDLINGS",
    "+20 FREE SEEDLINGS",
    "+20 FREE SEEDLINGS",
    "+30 FREE SEEDLINGS",
    "+30 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
];

const prizeTiers = {

    starter: [
        "+15 FREE SEEDLINGS",
        "+15 FREE SEEDLINGS",
        "+20 FREE SEEDLINGS",
        "+20 FREE SEEDLINGS",
        "+20 FREE SEEDLINGS",
        "+30 FREE SEEDLINGS",
        "+30 FREE SEEDLINGS",
        "SPECIAL DISCOUNT"
    ],

    lucky: [
        "+30 FREE SEEDLINGS",
        "+30 FREE SEEDLINGS",
        "+40 FREE SEEDLINGS",
        "+40 FREE SEEDLINGS",
        "+40 FREE SEEDLINGS",
        "+50 FREE SEEDLINGS",
        "+50 FREE SEEDLINGS",
        "SPECIAL DISCOUNT"
    ],

    great: [
        "+40 FREE SEEDLINGS",
        "+40 FREE SEEDLINGS",
        "+50 FREE SEEDLINGS",
        "+50 FREE SEEDLINGS",
        "+50 FREE SEEDLINGS",
        "+60 FREE SEEDLINGS",
        "+60 FREE SEEDLINGS",
        "SPECIAL DISCOUNT"
    ],

    super: [
        "+150 FREE SEEDLINGS",
        "+150 FREE SEEDLINGS",
        "+200 FREE SEEDLINGS",
        "+200 FREE SEEDLINGS",
        "+200 FREE SEEDLINGS",
        "+250 FREE SEEDLINGS",
        "+250 FREE SEEDLINGS",
        "SPECIAL DISCOUNT"
    ],

    mega: [
        "+300 FREE SEEDLINGS",
        "+300 FREE SEEDLINGS",
        "+300 FREE SEEDLINGS",
        "+400 FREE SEEDLINGS",
        "+400 FREE SEEDLINGS",
        "+450 FREE SEEDLINGS",
        "+500 FREE SEEDLINGS",
        "SPECIAL DISCOUNT"
    ]

};
    const colors = [
        "#e63946",
        "#f1c40f",
        "#2a9d8f",
        "#457b9d",
        "#e76f51",
        "#9b5de5",
        "#06d6a0",
        "#f4a261"
    ];

    const center = 200;
    const radius = 190;

    let currentRotation = 0;
    let spinning = false;
let currentQuantity = 0;
function getCashFloor(quantity) {

    if (quantity >= 10000) {
        return 30000;

    } else if (quantity >= 5000) {
        return 15000;

    } else if (quantity >= 2000) {
        return 6000;

    } else if (quantity >= 1000) {
        return 3000;

    } else {
        return 1500;
    }
}
function calculateCashPayment(
    quantity,
    discountPerPiece
) {

    const regularValue =
        quantity * 4;

    const discount =
        quantity * discountPerPiece;

    const cashPayment =
        regularValue - discount;

    const cashFloor =
        getCashFloor(quantity);

    return {
        regularValue: regularValue,
        discount: discount,
        cashPayment: cashPayment,
        cashFloor: cashFloor,
        safe: cashPayment >= cashFloor
    };
}
    let lastTickAngle = 0;
    let audioContext;
const quantityInput =
    document.getElementById("quantity");

const checkSpinsButton =
    document.getElementById("checkSpins");

const spinInfo =
    document.getElementById("spinInfo");
    function tickSound() {

        if (!audioContext) {
            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.frequency.value = 1100;
        oscillator.type = "square";

        gain.gain.setValueAtTime(
            0.08,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.06
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + 0.06
        );
    }


    function winSound() {

        if (!audioContext) {
            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
            520,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            1040,
            audioContext.currentTime + 0.18
        );

        gain.gain.setValueAtTime(
            0.15,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.5
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + 0.5
        );
    }


    function drawWheel() {

        const slice =
            (2 * Math.PI) / prizes.length;

        ctx.clearRect(0, 0, 400, 400);

        for (let i = 0; i < prizes.length; i++) {

            const startAngle =
                currentRotation + i * slice;

            const endAngle =
                startAngle + slice;

            ctx.beginPath();

            ctx.moveTo(center, center);

            ctx.arc(
                center,
                center,
                radius,
                startAngle,
                endAngle
            );

            ctx.closePath();

            ctx.fillStyle = colors[i];

            ctx.fill();

            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;

            ctx.stroke();

            ctx.save();

            ctx.translate(center, center);

            ctx.rotate(
                startAngle + slice / 2
            );

            ctx.textAlign = "right";

            ctx.fillStyle = "white";

           ctx.font = "bold 16px Arial";

const prizeText = prizes[i];

if (prizeText.includes("FREE SEEDLINGS")) {

    const amount =
        prizeText.replace(
            "+",
            ""
        ).replace(
            " FREE SEEDLINGS",
            ""
        );

    ctx.fillText(
        "+" + amount,
        radius - 15,
        -5
    );

    ctx.font = "bold 13px Arial";

    ctx.fillText(
        "FREE SEEDLINGS",
        radius - 15,
        10
    );

} else {

    ctx.font = "bold 16px Arial";

    ctx.fillText(
        "SPECIAL",
        radius - 15,
        -5
    );

    ctx.fillText(
        "DISCOUNT",
        radius - 15,
        10
    );
}

            ctx.restore();
        }
    }


    drawWheel();


    spinButton.addEventListener(
        "click",
        function() {

            if (spinning) return;

            spinning = true;

            spinButton.disabled = true;

            result.textContent = "";

            lastTickAngle = currentRotation;


            const winner =
                Math.floor(
                    Math.random() * prizes.length
                );


            const slice =
                (2 * Math.PI) / prizes.length;


            const targetAngle =
                (Math.PI * 3 / 2)
                - (winner * slice)
                - (slice / 2);


            const startRotation =
                currentRotation;


            const extraSpins =
                18 * Math.PI;


            const finalRotation =
                startRotation +
                extraSpins +
                (
                    targetAngle -
                    (
                        startRotation %
                        (2 * Math.PI)
                    )
                );


            const duration = 10000;

            const startTime =
                performance.now();


            function animate(time) {

                const elapsed =
                    time - startTime;


                const progress =
                    Math.min(
                        elapsed / duration,
                        1
                    );


                const ease =
                    1 -
                    Math.pow(
                        1 - progress,
                        5
                    );


                currentRotation =
                    startRotation +
                    (
                        finalRotation -
                        startRotation
                    ) * ease;


                const tickSpacing =
                    (2 * Math.PI) /
                    prizes.length;


              const tickDistance =
    Math.abs(
        currentRotation -
        lastTickAngle
    );

const normalTickSpacing =
    tickSpacing;

const finalPhase =
    progress > 0.82;

const currentTickSpacing =
    finalPhase
        ? normalTickSpacing * 0.55
        : normalTickSpacing;

if (tickDistance >= currentTickSpacing) {

    tickSound();

    lastTickAngle =
        currentRotation;
}


                drawWheel();


                if (progress < 1) {

                    requestAnimationFrame(
                        animate
                    );

                } else {

                    spinning = false;

                    spinButton.disabled = false;

                    winSound();
if (prizes[winner] === "+500 FREE SEEDLINGS") {

    result.innerHTML =
        "👑🎉 MEGA JACKPOT! 🎉👑<br><br>" +
        "🌱 +500 FREE SEEDLINGS! 🌱";

}
                   if (prizes[winner] === "SPECIAL DISCOUNT") {

    let discountPerPiece;

    if (currentQuantity >= 5000) {

    discountPerPiece = 1.00;

} else if (currentQuantity >= 2000) {

    discountPerPiece = 1.00;

} else if (currentQuantity >= 1000) {

    discountPerPiece = 1.00;

} else {

    discountPerPiece = 0.50;
}

    const discountAmount =
    currentQuantity * discountPerPiece;

const paymentCheck =
    calculateCashPayment(
        currentQuantity,
        discountPerPiece
    );

if (!paymentCheck.safe) {

    result.innerHTML =
        "🔐 SPECIAL DISCOUNT PROTECTED!<br><br>" +
        "Your cash reward is protected for this order.";

} else {

    result.innerHTML =
        "💥 SPECIAL LUCK! 💥<br><br>" +
        "₱" +
        discountPerPiece.toFixed(2) +
        " OFF PER SEEDLING!<br><br>" +
        "Your discount: ₱" +
        discountAmount.toLocaleString();
}

    result.innerHTML =
        "💥 SPECIAL LUCK! 💥<br><br>" +
        "₱" +
        discountPerPiece.toFixed(2) +
        " OFF PER SEEDLING!<br><br>" +
        "Your discount: ₱" +
        discountAmount.toLocaleString();

} else {

    result.textContent =
        "🎉 YOU WON: " +
        prizes[winner] +
        "!";
}
                }
            }


            requestAnimationFrame(
                animate
            );

        }
    );
checkSpinsButton.addEventListener(
    "click",
    function() {

        const quantity =
            Number(quantityInput.value);

currentQuantity = quantity;

        if (quantity < 500) {

            spinInfo.textContent =
                "Minimum order is 500 seedlings.";

            return;
        }

        let tier;
        let minimumCash;
let selectedPrizeTier;

        if (quantity >= 10000) {

    tier = "👑 MEGA LUCK";
    minimumCash = 30000;
    selectedPrizeTier = prizeTiers.mega;

       } else if (quantity >= 5000) {

    tier = "🔥 SUPER LUCK";
    minimumCash = 15000;
    selectedPrizeTier = prizeTiers.super;

        } else if (quantity >= 2000) {

    tier = "🌟 GREAT LUCK";
    minimumCash = 6000;
    selectedPrizeTier = prizeTiers.great;

       } else if (quantity >= 1000) {

    tier = "⭐ LUCKY";
    minimumCash = 3000;
    selectedPrizeTier = prizeTiers.lucky;

        } else {

    tier = "🍀 STARTER LUCK";
    minimumCash = 1500;
    selectedPrizeTier = prizeTiers.starter;
        }

prizes = selectedPrizeTier;
drawWheel();

                spinInfo.innerHTML =
            tier +
            "<br><br>" +
            "🎡 You are eligible for Lucky Spin!";

    }
);</script>

</body>
</html>
