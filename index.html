<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Araucaria Lucky Spin</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #123d2a;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
      width: 95%;
      max-width: 500px;
    }

    h1 {
      margin-bottom: 20px;
      color: #ffd700;
    }

    .wheel-box {
      position: relative;
      width: 360px;
      max-width: 90vw;
      aspect-ratio: 1;
      margin: auto;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    .pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 38px solid #e60000;
      z-index: 5;
    }

    button {
      margin-top: 30px;
      padding: 15px 45px;
      border: none;
      border-radius: 50px;
      background: #ffd700;
      color: #123d2a;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      min-height: 35px;
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌲 ARAUCARIA LUCKY SPIN 🎡</h1>

    <div class="wheel-box">
      <div class="pointer"></div>
      <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <button id="spinButton">SPIN!</button>

    <div id="result">Good luck! 🌲</div>

  </div>

  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const result = document.getElementById("result");

    const prizes = [
      "15 FREE SEEDLINGS",
      "20 FREE SEEDLINGS",
      "30 FREE SEEDLINGS",
      "₱0.50 OFF / PC",
      "TRY AGAIN",
      "50 FREE SEEDLINGS",
      "₱1 OFF / PC",
      "30 FREE SEEDLINGS"
    ];

    const colors = [
      "#d62828",
      "#fcbf49",
      "#2a9d8f",
      "#e76f51",
      "#264653",
      "#90be6d",
      "#f77f00",
      "#6a4c93"
    ];

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 240;

    let currentRotation = 0;
    let spinning = false;

    function drawWheel() {
      const slice = (Math.PI * 2) / prizes.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < prizes.length; i++) {

        const start = currentRotation + i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, start, end);
        ctx.closePath();

        ctx.fillStyle = colors[i];
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.save();

        ctx.translate(centerX, centerY);
        ctx.rotate(start + slice / 2);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        ctx.fillText(prizes[i], radius - 15, 0);

        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(centerX, centerY, 45, 0, Math.PI * 2);
      ctx.fillStyle = "#ffd700";
      ctx.fill();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5;
      ctx.stroke();

      ctx.fillStyle = "#123d2a";
      ctx.font = "bold 16px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("LUCKY", centerX, centerY - 9);
      ctx.fillText("SPIN", centerX, centerY + 10);
    }

    function spinWheel() {

      if (spinning) return;

      spinning = true;
      spinButton.disabled = true;
      result.textContent = "Spinning... 🎡";

      const startRotation = currentRotation;

      const extraSpins = 6 + Math.random() * 3;
      const randomAngle = Math.random() * Math.PI * 2;

      const targetRotation =
        startRotation +
        extraSpins * Math.PI * 2 +
        randomAngle;

      const duration = 5000;
      const startTime = performance.now();

      function animate(time) {

        const elapsed = time - startTime;
        let progress = elapsed / duration;

        if (progress > 1) progress = 1;

        // Smooth ease-out
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentRotation =
          startRotation +
          (targetRotation - startRotation) * easeOut;

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {

          spinning = false;
          spinButton.disabled = false;

          const slice = (Math.PI * 2) / prizes.length;

          let normalized =
            (Math.PI * 1.5 - currentRotation) %
            (Math.PI * 2);

          if (normalized < 0) {
            normalized += Math.PI * 2;
          }

          const selectedIndex =
            Math.floor(normalized / slice);

          result.textContent =
            "🎉 YOU WON: " + prizes[selectedIndex] + " 🎉";
        }
      }

      requestAnimationFrame(animate);
    }

    drawWheel();

    spinButton.addEventListener("click", spinWheel);
  </script>

</body>
</html>
