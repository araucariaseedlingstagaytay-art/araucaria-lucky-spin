<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Araucaria Lucky Spin</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #eef7ee;
    margin: 0;
    padding: 25px 15px;
}

h1 {
    color: #176b35;
}

.container {
    max-width: 600px;
    margin: auto;
}

input {
    padding: 12px;
    font-size: 18px;
    width: 220px;
    max-width: 80%;
    text-align: center;
    border: 2px solid #176b35;
    border-radius: 8px;
}

button {
    background: #176b35;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 19px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    margin: 6px;
}

button:hover {
    background: #0e4d26;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.wheel-container {
    position: relative;
    width: 400px;
    height: 400px;
    max-width: 90vw;
    max-height: 90vw;
    margin: 25px auto;
}

canvas {
    width: 400px;
    height: 400px;
    max-width: 90vw;
    max-height: 90vw;
    border-radius: 50%;
}

.pointer {
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 35px solid #d62828;
    z-index: 10;
}

#spinInfo {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
    color: #176b35;
}

#result {
    margin-top: 20px;
    font-size: 24px;
    font-weight: bold;
    color: #176b35;
}

.small {
    font-size: 14px;
    color: #666;
}

</style>
</head>

<body>

<div class="container">

<h1>🌱 Araucaria Lucky Spin 🎡</h1>

<p>
Enter the Lucky Code given to you by Araucaria Seedlings Tagaytay.
</p>

<div>

<strong>🎟️ ENTER YOUR LUCKY CODE</strong>

<br><br>

<input
    type="text"
    id="luckyCode"
    placeholder="Example: AS-216"
    maxlength="10"
    autocomplete="off"
>

<br><br>

<strong>📦 ENTER ORDER QUANTITY</strong>

<br><br>

<input
    type="number"
    id="quantity"
    placeholder="Example: 1000"
    min="500"
    step="500"
>

<br><br>

<button id="checkButton">
CHECK MY LUCK
</button>

<div id="spinInfo"></div>

</div>


<div class="wheel-container">

<div class="pointer"></div>

<canvas
    id="wheel"
    width="400"
    height="400">
</canvas>

</div>


<button
    id="spinButton"
    disabled>
SPIN!
</button>

<div id="result"></div>

<p class="small">
Minimum order: 500 seedlings
</p>

</div>


<script>

/* =========================================
   GOOGLE APPS SCRIPT WEB APP
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwnw4JjbqAWAWsWad1DkBvu20bUCg3d_7LzkAsR3n2Z4c1SanDIeiQsdHBPKvNOWQuE/exec";


/* =========================================
   ELEMENTS
========================================= */

const canvas =
document.getElementById("wheel");

const ctx =
canvas.getContext("2d");

const checkButton =
document.getElementById("checkButton");

const spinButton =
document.getElementById("spinButton");

const luckyCodeInput =
document.getElementById("luckyCode");

const quantityInput =
document.getElementById("quantity");

const spinInfo =
document.getElementById("spinInfo");

const result =
document.getElementById("result");


/* =========================================
   GAME VARIABLES
========================================= */

const center = 200;

const radius = 190;

let currentRotation = 0;

let spinning = false;

let currentQuantity = 0;

let currentCode = "";

let prizes = [];


/* =========================================
   PRIZE TIERS
========================================= */

const prizeTiers = {

starter: [
    "+15 FREE SEEDLINGS",
    "+15 FREE SEEDLINGS",
    "+20 FREE SEEDLINGS",
    "+20 FREE SEEDLINGS",
    "+20 FREE SEEDLINGS",
    "+30 FREE SEEDLINGS",
    "+30 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
],

lucky: [
    "+30 FREE SEEDLINGS",
    "+30 FREE SEEDLINGS",
    "+40 FREE SEEDLINGS",
    "+40 FREE SEEDLINGS",
    "+40 FREE SEEDLINGS",
    "+50 FREE SEEDLINGS",
    "+50 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
],

great: [
    "+40 FREE SEEDLINGS",
    "+40 FREE SEEDLINGS",
    "+50 FREE SEEDLINGS",
    "+50 FREE SEEDLINGS",
    "+50 FREE SEEDLINGS",
    "+60 FREE SEEDLINGS",
    "+60 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
],

super: [
    "+150 FREE SEEDLINGS",
    "+150 FREE SEEDLINGS",
    "+200 FREE SEEDLINGS",
    "+200 FREE SEEDLINGS",
    "+200 FREE SEEDLINGS",
    "+250 FREE SEEDLINGS",
    "+250 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
],

mega: [
    "+300 FREE SEEDLINGS",
    "+300 FREE SEEDLINGS",
    "+300 FREE SEEDLINGS",
    "+400 FREE SEEDLINGS",
    "+400 FREE SEEDLINGS",
    "+450 FREE SEEDLINGS",
    "+500 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
]

};


/* =========================================
   COLORS
========================================= */

const colors = [

"#e63946",
"#f1c40f",
"#2a9d8f",
"#457b9d",
"#e76f51",
"#9b5de5",
"#06d6a0",
"#f4a261"

];


/* =========================================
   AUDIO
========================================= */

let audioContext;


function startAudio() {

    if (!audioContext) {

        audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}


function tickSound() {

    startAudio();

    const oscillator =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.type = "square";

    oscillator.frequency.value =
        1100;

    gain.gain.setValueAtTime(
        0.07,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.06
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.06
    );

}


function winSound() {

    startAudio();

    const oscillator =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        520,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        1040,
        audioContext.currentTime + 0.18
    );

    gain.gain.setValueAtTime(
        0.15,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.5
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.5
    );

}


/* =========================================
   GOOGLE BACKEND REQUEST
========================================= */

function callBackend(
    action,
    code,
    quantity,
    prize = ""
) {

    return new Promise(
        function(resolve) {

            const callbackName =
                "backendCallback_" +
                Date.now() +
                "_" +
                Math.floor(
                    Math.random() * 100000
                );

            const script =
                document.createElement(
                    "script"
                );

            window[callbackName] =
                function(data) {

                    delete window[
                        callbackName
                    ];

                    script.remove();

                    resolve(data);

                };


            const url =
                API_URL +
                "?action=" +
                encodeURIComponent(
                    action
                ) +
                "&code=" +
                encodeURIComponent(
                    code
                ) +
                "&quantity=" +
                encodeURIComponent(
                    quantity
                ) +
                "&prize=" +
                encodeURIComponent(
                    prize
                ) +
                "&callback=" +
                callbackName;


            script.src = url;

            script.onerror =
                function() {

                    delete window[
                        callbackName
                    ];

                    script.remove();

                    resolve({

                        success: false,

                        message:
                        "Unable to connect to Lucky Spin server."

                    });

                };


            document.body.appendChild(
                script
            );

        }
    );

}


/* =========================================
   SELECT PRIZE TIER
========================================= */

function selectPrizeTier(
    quantity
) {

    if (quantity >= 10000) {

        return {
            name: "👑 MEGA LUCK",
            prizes: prizeTiers.mega
        };

    }

    if (quantity >= 5000) {

        return {
            name: "🔥 SUPER LUCK",
            prizes: prizeTiers.super
        };

    }

    if (quantity >= 2000) {

        return {
            name: "🌟 GREAT LUCK",
            prizes: prizeTiers.great
        };

    }

    if (quantity >= 1000) {

        return {
            name: "⭐ LUCKY",
            prizes: prizeTiers.lucky
        };

    }

    return {
        name: "🍀 STARTER LUCK",
        prizes: prizeTiers.starter
    };

}


/* =========================================
   DRAW WHEEL
========================================= */

function drawWheel() {

    if (!prizes.length) {
        return;
    }

    const slice =
        (2 * Math.PI) /
        prizes.length;


    ctx.clearRect(
        0,
        0,
        400,
        400
    );


    for (
        let i = 0;
        i < prizes.length;
        i++
    ) {

        const startAngle =
            currentRotation +
            i * slice;

        const endAngle =
            startAngle +
            slice;


        ctx.beginPath();

        ctx.moveTo(
            center,
            center
        );

        ctx.arc(
            center,
            center,
            radius,
            startAngle,
            endAngle
        );

        ctx.closePath();

        ctx.fillStyle =
            colors[i];

        ctx.fill();

        ctx.strokeStyle =
            "white";

        ctx.lineWidth = 3;

        ctx.stroke();


        ctx.save();

        ctx.translate(
            center,
            center
        );

        ctx.rotate(
            startAngle +
            slice / 2
        );

        ctx.textAlign =
            "right";

        ctx.fillStyle =
            "white";


        if (
            prizes[i].includes(
                "FREE SEEDLINGS"
            )
        ) {

            const amount =
                prizes[i]
                .replace("+", "")
                .replace(
                    " FREE SEEDLINGS",
                    ""
                );


            ctx.font =
                "bold 16px Arial";

            ctx.fillText(
                "+" + amount,
                radius - 15,
                -5
            );


            ctx.font =
                "bold 13px Arial";

            ctx.fillText(
                "FREE SEEDLINGS",
                radius - 15,
                10
            );

        } else {

            ctx.font =
                "bold 16px Arial";

            ctx.fillText(
                "SPECIAL",
                radius - 15,
                -5
            );

            ctx.fillText(
                "DISCOUNT",
                radius - 15,
                10
            );

        }


        ctx.restore();

    }

}


/* =========================================
   CHECK LUCKY CODE
========================================= */

checkButton.addEventListener(
    "click",
    async function() {

        const code =
            luckyCodeInput.value
            .trim()
            .toUpperCase();

        const quantity =
            Number(
                quantityInput.value
            );


        spinButton.disabled =
            true;


        result.textContent = "";


        if (
            /^AS-\d{3,}$/.test(code)
        ) {

            spinInfo.textContent =
                "⚠️ Enter a valid Lucky Code.";

            return;

        }


        if (quantity < 500) {

            spinInfo.textContent =
                "⚠️ Minimum order is 500 seedlings.";

            return;

        }


        checkButton.disabled =
            true;


        spinInfo.textContent =
            "🔐 Checking your Lucky Code...";


        const response =
            await callBackend(
                "check",
                code,
                quantity
            );


        if (!response.success) {

            spinInfo.textContent =
                "❌ " +
                response.message;

            checkButton.disabled =
                false;

            return;

        }


        currentCode =
            code;

        currentQuantity =
            quantity;


        const tier =
            selectPrizeTier(
                quantity
            );


        prizes =
            tier.prizes;


        drawWheel();


        spinInfo.innerHTML =
            tier.name +
            "<br><br>" +
            "🎡 Lucky Code accepted!<br>" +
            "You have <strong>1 SPIN</strong>.";


        result.textContent =
            "Good luck! 🌱";


        spinButton.disabled =
            false;

    }
);


/* =========================================
   SPIN
========================================= */

spinButton.addEventListener(
    "click",
    function() {

        if (spinning) {
            return;
        }


        if (
            !currentCode ||
            currentQuantity < 500 ||
            !prizes.length
        ) {

            return;

        }


        startAudio();


        spinning = true;

        spinButton.disabled =
            true;

        checkButton.disabled =
            true;


        result.textContent =
            "🎡 Spinning...";


        const winner =
            Math.floor(
                Math.random() *
                prizes.length
            );


        const slice =
            (2 * Math.PI) /
            prizes.length;


        const targetAngle =
            (Math.PI * 3 / 2)
            -
            (winner * slice)
            -
            (slice / 2);


        const startRotation =
            currentRotation;


        const extraSpins =
            18 * Math.PI;


        const finalRotation =
            startRotation +
            extraSpins +
            (
                targetAngle -
                (
                    startRotation %
                    (2 * Math.PI)
                )
            );


        const duration =
            10000;


        const startTime =
            performance.now();


        let lastTickAngle =
            currentRotation;


        function animate(time) {

            const elapsed =
                time -
                startTime;


            const progress =
                Math.min(
                    elapsed /
                    duration,
                    1
                );


            const ease =
                1 -
                Math.pow(
                    1 - progress,
                    5
                );


            currentRotation =
                startRotation +
                (
                    finalRotation -
                    startRotation
                ) * ease;


            const tickSpacing =
                (2 * Math.PI) /
                prizes.length;


            const tickDistance =
                Math.abs(
                    currentRotation -
                    lastTickAngle
                );


            const finalPhase =
                progress > 0.82;


            const currentTickSpacing =
                finalPhase
                ? tickSpacing * 0.55
                : tickSpacing;


            if (
                tickDistance >=
                currentTickSpacing
            ) {

                tickSound();

                lastTickAngle =
                    currentRotation;

            }


            drawWheel();


            if (
                progress < 1
            ) {

                requestAnimationFrame(
                    animate
                );

            } else {

                finishSpin(
                    winner
                );

            }

        }


        requestAnimationFrame(
            animate
        );

    }
);


/* =========================================
   FINISH SPIN
========================================= */

async function finishSpin(
    winner
) {

    const winningPrize =
        prizes[winner];


    winSound();


    result.innerHTML =
        "🎉 YOU WON:<br><br>" +
        winningPrize;


    spinInfo.innerHTML =
        "🔐 Recording your Lucky Code...";


    const response =
        await callBackend(
            "use",
            currentCode,
            currentQuantity,
            winningPrize
        );


    if (response.success) {

        spinInfo.innerHTML =
            "🔒 <strong>SPIN COMPLETE!</strong><br><br>" +
            "Lucky Code " +
            currentCode +
            " has been used.";


        result.innerHTML =
            "🎉 YOU WON:<br><br>" +
            winningPrize +
            "<br><br>" +
            "🎟️ Code: " +
            currentCode;


        /*
         * Permanently lock this page.
         */

        currentCode = "";

        currentQuantity = 0;

        prizes = [];

        spinning = false;

        spinButton.disabled =
            true;


        luckyCodeInput.disabled =
            true;

        quantityInput.disabled =
            true;

        checkButton.disabled =
            true;


    } else {

        /*
         * If recording fails,
         * do NOT pretend the code was used.
         */

        spinning = false;

        spinButton.disabled =
            true;

        spinInfo.innerHTML =
            "⚠️ Prize shown, but the server could not record the result.<br>" +
            "Please contact Araucaria Seedlings Tagaytay before leaving this page.";

    }

}


/* =========================================
   INITIAL WHEEL
========================================= */

prizes =
prizeTiers.starter;

drawWheel();

</script>

</body>
</html>
