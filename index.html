<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Araucaria Lucky Spin</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #eef7ee;
    margin: 0;
    padding: 20px;
    color: #176b35;
}

h1 {
    color: #176b35;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 18px;
    margin-top: 5px;
}

.card {
    max-width: 520px;
    margin: 20px auto;
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

input {
    padding: 12px;
    font-size: 18px;
    width: 210px;
    max-width: 80%;
    text-align: center;
    border: 2px solid #176b35;
    border-radius: 8px;
    box-sizing: border-box;
}

button {
    background: #176b35;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    margin: 6px;
}

button:hover {
    background: #0e4d26;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.code-box {
    background: #f4f9f4;
    border: 2px dashed #176b35;
    border-radius: 12px;
    padding: 15px;
    margin: 15px 0;
}

#generatedCode {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #d62828;
    margin: 10px;
}

#wheelContainer {
    position: relative;
    width: 400px;
    height: 400px;
    margin: 25px auto;
    max-width: 90vw;
    max-height: 90vw;
}

canvas {
    width: 400px;
    height: 400px;
    max-width: 90vw;
    max-height: 90vw;
    border-radius: 50%;
}

.pointer {
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 35px solid #d62828;
    z-index: 10;
}

#spinInfo {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
}

#result {
    margin: 20px auto;
    font-size: 25px;
    font-weight: bold;
    color: #176b35;
    max-width: 500px;
}

.warning {
    color: #d62828;
    font-weight: bold;
}

.success {
    color: #176b35;
    font-weight: bold;
}

.small {
    font-size: 14px;
    color: #555;
}

@media (max-width: 480px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 27px;
    }

    #wheelContainer {
        width: 330px;
        height: 330px;
    }

    canvas {
        width: 330px;
        height: 330px;
    }

    button {
        width: 90%;
        max-width: 320px;
    }
}
</style>
</head>

<body>

<h1>🌱 Araucaria Lucky Spin 🎡</h1>
<p class="subtitle">Your order comes with ONE Lucky Spin!</p>

<div class="card">

    <div class="code-box">

        <strong>🎟️ YOUR LUCKY CODE</strong>

        <div id="generatedCode">---</div>

        <button id="getCode">
            GET MY LUCKY CODE
        </button>

        <p class="small">
            Keep your Lucky Code for your promo record.
        </p>

    </div>

    <div>

        <strong>ENTER YOUR LUCKY CODE</strong>

        <br><br>

        <input
            type="text"
            id="codeInput"
            placeholder="Example: AS-216"
            maxlength="6"
            style="text-transform:uppercase;"
        >

    </div>

    <br>

    <div>

        <strong>ENTER ORDER QUANTITY</strong>

        <br><br>

        <input
            type="number"
            id="quantity"
            placeholder="Example: 1000"
            min="500"
            step="500"
        >

    </div>

    <br>

    <button id="checkSpins">
        CHECK MY LUCK
    </button>

    <div id="spinInfo"></div>

</div>


<div id="wheelContainer">

    <div class="pointer"></div>

    <canvas
        id="wheel"
        width="400"
        height="400">
    </canvas>

</div>

<button id="spinButton" disabled>
    🎡 SPIN!
</button>

<div id="result"></div>


<script>

const canvas =
    document.getElementById("wheel");

const ctx =
    canvas.getContext("2d");

const spinButton =
    document.getElementById("spinButton");

const result =
    document.getElementById("result");

const quantityInput =
    document.getElementById("quantity");

const codeInput =
    document.getElementById("codeInput");

const checkSpinsButton =
    document.getElementById("checkSpins");

const spinInfo =
    document.getElementById("spinInfo");

const getCodeButton =
    document.getElementById("getCode");

const generatedCode =
    document.getElementById("generatedCode");


/* =========================
   LUCKY CODE
========================= */

function createLuckyCode() {

    const number =
        Math.floor(
            Math.random() * 900
        ) + 100;

    return "AS-" + number;
}


getCodeButton.addEventListener(
    "click",
    function() {

        const existingCode =
            localStorage.getItem(
                "araucariaLuckyCode"
            );

        if (existingCode) {

            generatedCode.textContent =
                existingCode;

            codeInput.value =
                existingCode;

            return;
        }

        const newCode =
            createLuckyCode();

        localStorage.setItem(
            "araucariaLuckyCode",
            newCode
        );

        generatedCode.textContent =
            newCode;

        codeInput.value =
            newCode;

    }
);


/* =========================
   LOAD SAVED CODE
========================= */

const savedCode =
    localStorage.getItem(
        "araucariaLuckyCode"
    );

if (savedCode) {

    generatedCode.textContent =
        savedCode;

    codeInput.value =
        savedCode;
}


/* =========================
   PRIZES
========================= */

let prizes = [];


const prizeTiers = {

starter: [
    "+15 FREE SEEDLINGS",
    "+15 FREE SEEDLINGS",
    "+20 FREE SEEDLINGS",
    "+20 FREE SEEDLINGS",
    "+20 FREE SEEDLINGS",
    "+30 FREE SEEDLINGS",
    "+30 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
],

lucky: [
    "+30 FREE SEEDLINGS",
    "+30 FREE SEEDLINGS",
    "+40 FREE SEEDLINGS",
    "+40 FREE SEEDLINGS",
    "+40 FREE SEEDLINGS",
    "+50 FREE SEEDLINGS",
    "+50 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
],

great: [
    "+40 FREE SEEDLINGS",
    "+40 FREE SEEDLINGS",
    "+50 FREE SEEDLINGS",
    "+50 FREE SEEDLINGS",
    "+50 FREE SEEDLINGS",
    "+60 FREE SEEDLINGS",
    "+60 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
],

super: [
    "+150 FREE SEEDLINGS",
    "+150 FREE SEEDLINGS",
    "+200 FREE SEEDLINGS",
    "+200 FREE SEEDLINGS",
    "+200 FREE SEEDLINGS",
    "+250 FREE SEEDLINGS",
    "+250 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
],

mega: [
    "+300 FREE SEEDLINGS",
    "+300 FREE SEEDLINGS",
    "+300 FREE SEEDLINGS",
    "+400 FREE SEEDLINGS",
    "+400 FREE SEEDLINGS",
    "+450 FREE SEEDLINGS",
    "+500 FREE SEEDLINGS",
    "SPECIAL DISCOUNT"
]

};


const colors = [
    "#e63946",
    "#f1c40f",
    "#2a9d8f",
    "#457b9d",
    "#e76f51",
    "#9b5de5",
    "#06d6a0",
    "#f4a261"
];


const center = 200;
const radius = 190;

let currentRotation = 0;
let spinning = false;
let currentQuantity = 0;

let lastTickAngle = 0;
let audioContext;


/* =========================
   CASH PROTECTION
========================= */

function getCashFloor(quantity) {

    if (quantity >= 10000) {
        return 30000;
    }

    if (quantity >= 5000) {
        return 15000;
    }

    if (quantity >= 2000) {
        return 6000;
    }

    if (quantity >= 1000) {
        return 3000;
    }

    return 1500;
}


function calculateCashPayment(
    quantity,
    discountPerPiece
) {

    const regularValue =
        quantity * 4;

    const discount =
        quantity *
        discountPerPiece;

    const cashPayment =
        regularValue -
        discount;

    const cashFloor =
        getCashFloor(quantity);

    return {
        regularValue,
        discount,
        cashPayment,
        cashFloor,
        safe:
            cashPayment >= cashFloor
    };
}


/* =========================
   SOUND
========================= */

function startAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {
        audioContext.resume();
    }
}


function tickSound() {

    startAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.frequency.value =
        1100;

    oscillator.type =
        "square";

    gain.gain.setValueAtTime(
        0.08,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime +
        0.06
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        0.06
    );
}


function winSound() {

    startAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.type =
        "sine";

    oscillator.frequency.setValueAtTime(
        520,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        1040,
        audioContext.currentTime +
        0.18
    );

    gain.gain.setValueAtTime(
        0.15,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime +
        0.5
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        0.5
    );
}


/* =========================
   DRAW WHEEL
========================= */

function drawWheel() {

    if (!prizes.length) return;

    const slice =
        (2 * Math.PI) /
        prizes.length;

    ctx.clearRect(
        0,
        0,
        400,
        400
    );

    for (
        let i = 0;
        i < prizes.length;
        i++
    ) {

        const startAngle =
            currentRotation +
            i * slice;

        const endAngle =
            startAngle +
            slice;

        ctx.beginPath();

        ctx.moveTo(
            center,
            center
        );

        ctx.arc(
            center,
            center,
            radius,
            startAngle,
            endAngle
        );

        ctx.closePath();

        ctx.fillStyle =
            colors[i];

        ctx.fill();

        ctx.strokeStyle =
            "white";

        ctx.lineWidth =
            3;

        ctx.stroke();

        ctx.save();

        ctx.translate(
            center,
            center
        );

        ctx.rotate(
            startAngle +
            slice / 2
        );

        ctx.textAlign =
            "right";

        ctx.fillStyle =
            "white";

        const prizeText =
            prizes[i];

        if (
            prizeText.includes(
                "FREE SEEDLINGS"
            )
        ) {

            const amount =
                prizeText
                    .replace("+", "")
                    .replace(
                        " FREE SEEDLINGS",
                        ""
                    );

            ctx.font =
                "bold 16px Arial";

            ctx.fillText(
                "+" + amount,
                radius - 15,
                -5
            );

            ctx.font =
                "bold 13px Arial";

            ctx.fillText(
                "FREE SEEDLINGS",
                radius - 15,
                10
            );

        } else {

            ctx.font =
                "bold 16px Arial";

            ctx.fillText(
                "SPECIAL",
                radius - 15,
                -5
            );

            ctx.fillText(
                "DISCOUNT",
                radius - 15,
                10
            );
        }

        ctx.restore();
    }
}


/* =========================
   CHECK ELIGIBILITY
========================= */

checkSpinsButton.addEventListener(
    "click",
    function() {

        const code =
            codeInput.value
                .trim()
                .toUpperCase();

        const quantity =
            Number(
                quantityInput.value
            );

        if (
            !/^AS-\d{3}$/.test(code)
        ) {

            spinInfo.innerHTML =
                "<span class='warning'>" +
                "⚠️ Please enter a valid Lucky Code like AS-216." +
                "</span>";

            spinButton.disabled =
                true;

            return;
        }


        if (quantity < 500) {

            spinInfo.innerHTML =
                "<span class='warning'>" +
                "⚠️ Minimum order is 500 seedlings." +
                "</span>";

            spinButton.disabled =
                true;

            return;
        }


        currentQuantity =
            quantity;


        const usedKey =
            "araucariaSpinUsed_" +
            code;


        if (
            localStorage.getItem(
                usedKey
            ) === "true"
        ) {

            spinInfo.innerHTML =
                "<span class='warning'>" +
                "🔒 This Lucky Code has already been used." +
                "</span>";

            spinButton.disabled =
                true;

            result.textContent =
                "Your Lucky Spin has already been completed.";

            return;
        }


        let tier;
        let selectedPrizeTier;


        if (quantity >= 10000) {

            tier =
                "👑 MEGA LUCK";

            selectedPrizeTier =
                prizeTiers.mega;

        } else if (
            quantity >= 5000
        ) {

            tier =
                "🔥 SUPER LUCK";

            selectedPrizeTier =
                prizeTiers.super;

        } else if (
            quantity >= 2000
        ) {

            tier =
                "🌟 GREAT LUCK";

            selectedPrizeTier =
                prizeTiers.great;

        } else if (
            quantity >= 1000
        ) {

            tier =
                "⭐ LUCKY";

            selectedPrizeTier =
                prizeTiers.lucky;

        } else {

            tier =
                "🍀 STARTER LUCK";

            selectedPrizeTier =
                prizeTiers.starter;
        }


        prizes =
            selectedPrizeTier;

        drawWheel();


        spinInfo.innerHTML =
            "<span class='success'>" +
            tier +
            "<br><br>" +
            "🎡 YOU HAVE 1 LUCKY SPIN!" +
            "</span>";

        result.textContent =
            "Good luck, " +
            code +
            "! 🌱";

        spinButton.disabled =
            false;
    }
);


/* =========================
   SPIN
========================= */

spinButton.addEventListener(
    "click",
    function() {

        if (spinning) return;

        if (
            currentQuantity < 500 ||
            !prizes.length
        ) {

            result.textContent =
                "⚠️ Please check your Lucky Code and order quantity first.";

            return;
        }


        const code =
            codeInput.value
                .trim()
                .toUpperCase();

        const usedKey =
            "araucariaSpinUsed_" +
            code;


        if (
            localStorage.getItem(
                usedKey
            ) === "true"
        ) {

            result.textContent =
                "🔒 This Lucky Code has already been used.";

            return;
        }


        startAudio();

        spinning = true;

        spinButton.disabled =
            true;

        checkSpinsButton.disabled =
            true;

        result.textContent =
            "🎡 Spinning...";

        lastTickAngle =
            currentRotation;


        const winner =
            Math.floor(
                Math.random() *
                prizes.length
            );


        const slice =
            (2 * Math.PI) /
            prizes.length;


        const targetAngle =
            (Math.PI * 3 / 2)
            -
            (winner * slice)
            -
            (slice / 2);


        const startRotation =
            currentRotation;


        const extraSpins =
            18 * Math.PI;


        const finalRotation =
            startRotation +
            extraSpins +
            (
                targetAngle -
                (
                    startRotation %
                    (2 * Math.PI)
                )
            );


        const duration =
            10000;

        const startTime =
            performance.now();


        function animate(time) {

            const elapsed =
                time -
                startTime;

            const progress =
                Math.min(
                    elapsed /
                    duration,
                    1
                );


            const ease =
                1 -
                Math.pow(
                    1 - progress,
                    5
                );


            currentRotation =
                startRotation +
                (
                    finalRotation -
                    startRotation
                ) * ease;


            const tickSpacing =
                (2 * Math.PI) /
                prizes.length;


            const tickDistance =
                Math.abs(
                    currentRotation -
                    lastTickAngle
                );


            const finalPhase =
                progress > 0.82;


            const currentTickSpacing =
                finalPhase
                    ? tickSpacing * 0.55
                    : tickSpacing;


            if (
                tickDistance >=
                currentTickSpacing
            ) {

                tickSound();

                lastTickAngle =
                    currentRotation;
            }


            drawWheel();


            if (progress < 1) {

                requestAnimationFrame(
                    animate
                );

            } else {

                spinning =
                    false;

                winSound();


                /*
                 * LOCK THIS CODE
                 * AFTER THE ONE SPIN
                 */

                localStorage.setItem(
                    usedKey,
                    "true"
                );


                if (
                    prizes[winner] ===
                    "SPECIAL DISCOUNT"
                ) {

                    let discountPerPiece;


                    if (
                        currentQuantity >=
                        5000
                    ) {

                        discountPerPiece =
                            1.00;

                    } else if (
                        currentQuantity >=
                        2000
                    ) {

                        discountPerPiece =
                            1.00;

                    } else if (
                        currentQuantity >=
                        1000
                    ) {

                        discountPerPiece =
                            1.00;

                    } else {

                        discountPerPiece =
                            0.50;
                    }


                    const discountAmount =
                        currentQuantity *
                        discountPerPiece;


                    const paymentCheck =
                        calculateCashPayment(
                            currentQuantity,
                            discountPerPiece
                        );


                    if (
                        !paymentCheck.safe
                    ) {

                        result.innerHTML =
                            "🔐 SPECIAL DISCOUNT PROTECTED!<br><br>" +
                            "Your cash reward is protected for this order.";

                    } else {

                        result.innerHTML =
                            "💥 SPECIAL LUCK! 💥<br><br>" +
                            "₱" +
                            discountPerPiece.toFixed(2) +
                            " OFF PER SEEDLING!<br><br>" +
                            "Your discount: ₱" +
                            discountAmount.toLocaleString();
                    }

                } else {

                    result.innerHTML =
                        "🎉 YOU WON! 🎉<br><br>" +
                        prizes[winner] +
                        "<br><br>" +
                        "Lucky Code: " +
                        code;
                }


                spinInfo.innerHTML =
                    "<span class='success'>" +
                    "🔒 SPIN COMPLETED<br>" +
                    "Thank you for joining!" +
                    "</span>";

                spinButton.disabled =
                    true;

                checkSpinsButton.disabled =
                    false;
            }
        }


        requestAnimationFrame(
            animate
        );

    }
);


/* =========================
   INITIAL WHEEL
========================= */

prizes =
    prizeTiers.starter;

drawWheel();

</script>

</body>
</html>
